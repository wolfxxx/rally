name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test maze generation and driving
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static game
        run: |
          mkdir _site
          cp index.html style.css favicon.svg _site/
          cp -R src _site/src
          touch _site/.nojekyll
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the game
        id: deployment
        uses: actions/deploy-pages@v4
